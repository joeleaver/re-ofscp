[workspace]
resolver = "3"
members = ["crates/ofscp-core", "crates/re-ofscp-types", "crates/re-ofscp-server"]
# The admin UI is a wasm32 crate built by trunk (jkbase `[sites.admin]`); it is
# NOT a workspace member, so `cargo build`/`cargo test` at the root (and the
# jkbase Rust server buildpack) never try to compile it for the host.
exclude = ["admin-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeleaver/re-ofscp"
rust-version = "1.99"

[workspace.dependencies]
ofscp-core = { path = "crates/ofscp-core" }
re-ofscp-types = { path = "crates/re-ofscp-types" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Only to tell a WebSocket read that hit the size limit from other errors;
# the same version axum's `ws` feature uses.
tungstenite = { version = "0.29", default-features = false }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["alloc", "serde"] }
zeroize = { version = "1", default-features = false }
time = { version = "0.3", features = ["formatting", "parsing"] }
http-body-util = "0.1"
psl = "2"
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
hmac = "0.12"
sha1 = "0.10"
chacha20poly1305 = "0.10"
subtle = "2"
data-encoding = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Outbound HTTPS (docs/decisions/0006): rustls with our own root store (the
# bundled Mozilla roots), no default features (no proxy discovery, no
# decompression, no native TLS).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"
# Allow-list HTML sanitizer for text/html message bodies (spec §5.3).
ammonia = "4.2"

# rhypedb (the database) — pinned to an exact upstream commit. Bump deliberately.
rhypedb-client = { git = "https://github.com/joeleaver/rhypedb", rev = "7b78190579661cc91508afea1ee1fe2bd54881a1", features = ["async"] }
rhypedb-schema = { git = "https://github.com/joeleaver/rhypedb", rev = "7b78190579661cc91508afea1ee1fe2bd54881a1" }

[profile.release]
lto = "thin"
codegen-units = 1

# Argon2id at the spec's 64 MiB / 3 passes is very slow unoptimised; build
# the hashing crates optimised in dev and test so tests use real parameters.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
