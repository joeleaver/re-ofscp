name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (pinned 1.99.0 + rustfmt/clippy).
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Conformance tests read the spec's vectors and samples from a sibling
      # checkout (../ofscp), as Forumall's CI does.
      - run: git clone --depth 1 https://github.com/lost-conn/ofscp "$GITHUB_WORKSPACE/../ofscp"
      # Integration tests run against a real rhypedb-server at the commit
      # Cargo.toml pins (scripts/install-rhypedb.sh reads it from there).
      - id: rhypedb-rev
        run: echo "rev=$(scripts/install-rhypedb.sh --print-rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/rhypedb-*
          key: rhypedb-server-${{ runner.os }}-${{ steps.rhypedb-rev.outputs.rev }}
      - run: scripts/install-rhypedb.sh
      # The jkbase builder fetches with --locked: a stale lockfile must fail here.
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  admin-web:
    name: admin-web (trunk build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin-web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # The jkbase builder fetches with --locked: a stale lockfile must fail here.
      - run: cargo fetch --locked --manifest-path admin-web/Cargo.toml
      - run: cargo fmt --manifest-path admin-web/Cargo.toml --check
      - run: trunk build --release
        working-directory: admin-web
