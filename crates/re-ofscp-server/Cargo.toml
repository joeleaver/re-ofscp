[package]
name = "re-ofscp-server"
description = "re-ofscp: an enterprise-grade OFSCP provider (server binary)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The jkbase Rust buildpack launches the binary named here (`/app/re-ofscp`).
[[bin]]
name = "re-ofscp"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
ofscp-core = { workspace = true }
re-ofscp-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rhypedb-client = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
time = { workspace = true }
http-body-util = { workspace = true }
psl = { workspace = true }
argon2 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
chacha20poly1305 = { workspace = true }
subtle = { workspace = true }
data-encoding = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
url = { workspace = true }

[dev-dependencies]
rhypedb-schema = { workspace = true }
tower = { version = "0.5", features = ["util"] }
time = { workspace = true, features = ["macros"] }
serde_json = { workspace = true }
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
# A local https "remote provider" for the outbound and remote-key tests.
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
